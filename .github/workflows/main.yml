name: Lint Code Base

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install jshint
      run: npm install -g jshint
    - name: Lint JS with jshint
      run: jshint server/database/app.js
